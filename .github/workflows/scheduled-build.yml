name: Scheduled Build
on:
  schedule:
    # Nightly build at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  nightly:
    permissions:
      actions: read
      contents: write
      security-events: write
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      ref: develop
      skip_code_scans: true
      skip_linkcheck: true
    secrets: inherit
